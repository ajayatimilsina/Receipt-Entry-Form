<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>領収書作成ツール</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .receipt { width: 600px; max-width: 100%; margin: 20px auto; padding: 40px; border: 1px solid #ccc; background: white; box-sizing: border-box; }
        .amount-box { border: 1px solid #333; padding: 10px; margin: 20px 0; font-size: 1.5rem; }
        @page {
            size: A4 portrait;
            margin: 10mm;
        }
        @media print {
            html, body { margin: 0; padding: 0; }
            .no-print { display: none; }
            body { background: white; }
            .receipt { border: none; margin: 0; width: 100%; max-width: 100%; }
        }
        @media (max-width: 576px) {
            body { padding: 10px; }
            .receipt { padding: 20px; }
            .amount-box { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

<div class="container no-print">
    <h3>領収書入力フォーム</h3>
    <div class="row">
        <div class="col-md-6">
            <input type="date" id="inputDate" class="form-control mb-2">
            <input type="text" id="inputName" class="form-control mb-2" placeholder="宛名 (様)">
            <input type="number" id="inputAmount" class="form-control mb-2" placeholder="金額">
            
            <label>但し書き：</label>
            <select id="inputReason" class="form-control mb-2">
                <option value="お食事代として">お食事代として</option>
                <option value="ランチ代として">ランチ代として</option>
                <option value="ディナー代として">ディナー代として</option>
                <option value="会議費として">会議費として</option>
                <option value="接待費として">接待費として</option>
                <option value="懇親会費として">懇親会費として</option>
                <option value="飲食代として">飲食代として</option>
                <option value="お品代として">お品代として</option>
                <option value="備品購入代として">備品購入代として</option>
                <option value="交通費として">交通費として</option>
            </select>

            <input type="text" id="inputRestaurant" class="form-control mb-2" placeholder="店舗名">
            <input type="text" id="inputTel" class="form-control mb-3" placeholder="電話番号">
            
            <button type="button" class="btn btn-primary" onclick="generateReceipt()">表示する</button>
            <button type="button" class="btn btn-secondary" onclick="window.print()">印刷する（iPhone / OS）</button>
        </div>
    </div>
</div>

<div class="receipt" id="receiptContent">
    <div class="text-end">発行日：<span id="displayDate">YYYY/MM/DD</span></div>
    <h2 class="text-center">領 収 書</h2>
    <div class="mt-4">
        <span id="displayName">＿＿＿＿＿＿＿＿＿＿</span> 様
    </div>
    <div class="amount-box text-center">
        ￥ <span id="displayAmount">0</span> - (税込)
    </div>
    <p>但し、<span id="displayReason">お食事代として</span>正に領収いたしました。</p>
    
    <div class="row mt-5">
        <div class="col-6">
            <p>内訳<br>税抜金額 ￥<br>消費税額 ￥</p>
        </div>
        <div class="col-6 text-end">
            <div style="border:1px solid #ccc; width: 100px; height: 100px; display: inline-block; text-align: center; padding-top: 35px;">収入印紙</div>
        </div>
    </div>
    <div class="mt-4 text-end">
        <div style="font-size: 1.2rem; font-weight: bold;" id="displayRestaurant">店舗名</div>
        <div>TEL: <span id="displayTel"></span></div>
    </div>
</div>

<script>
    function generateReceipt() {
        const dateVal = document.getElementById('inputDate').value;
        document.getElementById('displayDate').innerText = dateVal ? dateVal.replace(/-/g, '/') : 'YYYY/MM/DD';
        document.getElementById('displayName').innerText = document.getElementById('inputName').value || '＿＿＿＿＿＿＿＿＿＿';
        document.getElementById('displayAmount').innerText = document.getElementById('inputAmount').value || '0';
        document.getElementById('displayReason').innerText = document.getElementById('inputReason').value;
        document.getElementById('displayRestaurant').innerText = document.getElementById('inputRestaurant').value || '店舗名';
        document.getElementById('displayTel').innerText = document.getElementById('inputTel').value;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const today = new Date().toISOString().split('T')[0];
        const fields = [
            document.getElementById('inputDate'),
            document.getElementById('inputName'),
            document.getElementById('inputAmount'),
            document.getElementById('inputReason'),
            document.getElementById('inputRestaurant'),
            document.getElementById('inputTel')
        ];

        document.getElementById('inputDate').value = today;
        fields.forEach(function (field) {
            if (field) {
                field.addEventListener('input', generateReceipt);
                field.addEventListener('change', generateReceipt);
            }
        });

        generateReceipt();
    });
</script>

</body>
</html>
